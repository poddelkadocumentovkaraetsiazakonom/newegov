<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="app-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <title>Удостоверение личности</title>
</head>
<body class="doc-body">

  <!-- Скрытый файл инпут для загрузки удостоверения -->
  <input type="file" id="fileInput" accept="image/*" style="display: none;">

  <!-- Фиксированная верхняя панель -->
  <div class="top-bar">
    <div class="header-nav">
      <a href="index.html" class="icon-btn" aria-label="Закрыть">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </a>
      <h1 class="title">Удостоверение личности</h1>
      <button class="icon-btn" aria-label="Поделиться">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
          <polyline points="16 6 12 2 8 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="15"></line>
        </svg>
      </button>
    </div>

    <!-- Переключатель Вкладок -->
    <div class="tabs">
      <div class="tab active" id="tabDoc">Документ</div>
      <div class="tab" id="tabReq">Реквизиты</div>
    </div>
  </div>

  <!-- Рабочая область просмотра документа -->
  <div class="content-viewport">
    <div id="documentSection" class="doc-section">
      <div class="zoom-container" id="zoomContainer">
        <!-- По умолчанию показываем плейсхолдер или загруженное пользователем фото -->
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='190' viewBox='0 0 300 190'><rect width='100%' height='100%' fill='%23f2f2f7'/><text x='50%' y='50%' font-family='sans-serif' font-size='14' fill='%238e8e93' text-anchor='middle' dy='.3em'>Нажмите для выбора фото</text></svg>" id="zoomImage" class="document-card" alt="Удостоверение">
      </div>
    </div>

    <!-- Секция реквизитов -->
    <div id="requisitesSection" class="requisites-section hidden">
      <div class="info-item">
        <div class="label">ФИО</div>
        <div class="value" id="val-fullname">—</div>
      </div>
      <div class="info-item">
        <div class="label">ИИН</div>
        <div class="value" id="val-iin">—</div>
      </div>
      <div class="info-item">
        <div class="label">Дата рождения</div>
        <div class="value" id="val-dob">—</div>
      </div>
      <div class="info-item">
        <div class="label">Номер документа</div>
        <div class="value" id="val-docnum">—</div>
      </div>
      <div class="info-item">
        <div class="label">Дата выдачи</div>
        <div class="value" id="val-issuedate">—</div>
      </div>
      <div class="info-item">
        <div class="label">Срок действия</div>
        <div class="value" id="val-expdate">—</div>
      </div>
      <div class="info-item">
        <div class="label">Орган выдачи</div>
        <div class="value" id="val-issuer">—</div>
      </div>
      <div class="info-item">
        <div class="label">Национальность</div>
        <div class="value" id="val-nationality">—</div>
      </div>
    </div>
  </div>

  <!-- Фиксированная нижняя панель -->
  <div class="bottom-bar">
    <div class="action-btn-group">
      <button class="primary-btn" id="openAccessBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="3" y="3" width="18" height="18" rx="4"></rect>
          <path d="M7 7h3v3H7zM14 7h3v3h-3zM7 14h3v3H7zM14 14h3v3h-3z"></path>
        </svg>
        <span>Открыть доступ</span>
      </button>
      <button class="more-btn" aria-label="Опции">
        <span>•••</span>
      </button>
    </div>
  </div>

  <!-- Модальное окно редактирования реквизитов (открывается при клике на реквизиты) -->
  <div id="editReqModal" class="qr-modal hidden">
    <div class="qr-sheet edit-sheet">
      <div class="drag-handle"></div>
      <h3 style="margin-bottom: 12px; font-size: 17px;">Реквизиты документа</h3>
      <form id="reqForm" class="edit-form">
        <input type="text" id="in-fullname" placeholder="ФИО">
        <input type="text" id="in-iin" placeholder="ИИН">
        <input type="text" id="in-dob" placeholder="Дата рождения">
        <input type="text" id="in-docnum" placeholder="Номер документа">
        <input type="text" id="in-issuedate" placeholder="Дата выдачи">
        <input type="text" id="in-expdate" placeholder="Срок действия">
        <input type="text" id="in-issuer" placeholder="Орган выдачи">
        <input type="text" id="in-nationality" placeholder="Национальность">
        
        <div style="display: flex; gap: 8px; margin-top: 12px;">
          <button type="button" id="clearDataBtn" class="clear-btn">Удалить все данные</button>
          <button type="submit" class="primary-btn" style="height: 44px; flex: 1;">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <!-- QR Модалка -->
  <div id="qrModal" class="qr-modal hidden">
    <div class="qr-sheet">
      <div class="drag-handle"></div>
      <h2>Доступ к документу</h2>
      <div id="qrcode"></div>
      <div id="timer" class="timer"></div>
      <div id="shortCode" class="short-code"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
