<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="app-icon.png">
  <link rel="stylesheet" href="style.css">
  <title>eGov Mobile</title>
</head>
<body>

  <div class="home-container">
    <!-- Поисковая строка -->
    <div class="search-bar">
      <div class="search-input">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Поиск по eGov</span>
      </div>
      <div class="ai-badge">eGov AI</div>
    </div>

    <!-- Верхние баннеры -->
    <div class="top-banners-scroll">
      <div class="banner banner-gpt">
        <div>
          <div class="banner-sub">eGov AI</div>
          <div class="banner-title">Задайте вопрос ChatGPT</div>
          <div class="banner-desc">Ответит на любой вопрос по госуслугам</div>
        </div>
        <div class="banner-ai-tag">AI</div>
      </div>
      <div class="banner banner-gas">
        <div>
          <div class="banner-sub">Услуги</div>
          <div class="banner-title">Подача заявки на газ</div>
          <div class="banner-desc">Быстрое подключение онлайн</div>
        </div>
        <div class="banner-arrow">→</div>
      </div>
    </div>

    <!-- Раздел «Цифровые документы» -->
    <div class="docs-section">
      <div class="docs-row">
        <div class="docs-left-col">
          <h2 class="section-title">Цифровые<br>документы</h2>
          <a href="#" class="all-docs-btn">Все (1)</a>
        </div>

        <!-- Карточка Удостоверения личности -->
        <a href="document.html" class="doc-card-link">
          <div class="doc-card-top">
            <img src="id-card.png" class="doc-cover-img" alt="Удостоверение" onerror="this.src='my-id.jpg'">
          </div>
          <div class="doc-title">Удостоверение личности</div>
        </a>
      </div>
    </div>

    <!-- Раздел «Сервисы» -->
    <h2 class="section-header margin-top">Сервисы</h2>
    <div class="services-grid">
      <div class="service-card">
        <div class="s-icon"><img src="icons/egov-main.png" class="service-img" alt="eGov" onerror="this.style.display='none'"></div>
      </div>
      <div class="service-card">
        <div class="s-icon"><img src="icons/e-otinish.png" class="service-img" alt="e-Otinish" onerror="this.style.display='none'"></div>
      </div>
      <div class="service-card">
        <div class="s-icon"><img src="icons/zakon.png" class="service-img" alt="Законодательство" onerror="this.style.display='none'"></div>
      </div>
      <div class="service-card">
        <div class="s-icon"><img src="icons/taza-qazaqstan.png" class="service-img" alt="Таза Қазақстан" onerror="this.style.display='none'"></div>
      </div>
    </div>

    <!-- Баннер Налогового Кодекса -->
    <div class="tax-banner">
      <div class="tax-content">
        <span class="tax-tag">Налоговый кодекс</span>
        <div class="tax-title">Ознакомьтесь с новыми правилами</div>
      </div>
      <div class="tax-badge">
        <img src="tax-badge.png" class="tax-badge-img" alt="КГД">
      </div>
      <div class="tax-arrow">›</div>
      <div class="tax-dots-capsule">
        <div class="tdot active"></div>
        <div class="tdot"></div>
        <div class="tdot"></div>
      </div>
    </div>
  </div>

  <!-- Нижний Tab Bar -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      <span>Главная</span>
    </div>
    <div class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="2"></rect>
        <rect x="14" y="3" width="7" height="7" rx="2"></rect>
        <rect x="14" y="14" width="7" height="7" rx="2"></rect>
        <rect x="3" y="14" width="7" height="7" rx="2"></rect>
      </svg>
      <span>Сервисы</span>
    </div>
    <div class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
      </svg>

      <span>Уведомления</span>
    </div>
    <div class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>Профиль</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
